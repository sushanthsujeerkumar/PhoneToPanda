<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="990" viewBox="0 0 1560 990" role="img" aria-labelledby="title desc">
<title id="title">Right-arm IMU wiring</title><desc id="desc">ESP32-S3 GPIO 8 SDA and GPIO 9 SCL connect to a TCA9548A multiplexer. Both right-arm IMUs share channel 2: SD2 to SDA and SC2 to SCL. All boards share 3.3 volt power and ground. Upper arm S4 is stream ID 3 at address 0x68. Forearm S5 is ID 4 at 0x69.</desc>
